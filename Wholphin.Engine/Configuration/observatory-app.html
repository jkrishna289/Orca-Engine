ime (days)",kind:"int",min:1,max:90,help:"Seeded picks live twice as long."},{key:"DiscoveryMaxUsersPerCycle",label:"Users per cycle",kind:"int",min:1,max:100,help:"Rotation size — users are pulled oldest-first."},{key:"DiscoveryExplorationFraction",label:"Exploration share",kind:"float",min:0,max:.5,step:.05,help:"Share of picks reserved for labelled exploration."},{key:"DiscoveryTrendingTasteWeight",label:"Trending taste weight",kind:"float",min:0,max:1,step:.05,help:"0 is pure popularity; higher flavours trending with the viewer's taste."}]},{title:"Ranking weights",blurb:"Advanced. These sum into the final score — changing one changes the balance of all of them.",fields:[{key:"WeightRecPersonalization",label:"For You · personalization",kind:"float",min:0,max:1,step:.05},{key:"WeightRecQuality",label:"For You · quality",kind:"float",min:0,max:1,step:.05},{key:"WeightRecRecency",label:"For You · recency",kind:"float",min:0,max:1,step:.05},{key:"WeightRecAvailability",label:"For You · availability",kind:"float",min:0,max:1,step:.05},{key:"WeightDiscTaste",label:"Discovery · taste",kind:"float",min:0,max:1,step:.05},{key:"WeightDiscPopularity",label:"Discovery · popularity",kind:"float",min:0,max:1,step:.05},{key:"WeightDiscFreshness",label:"Discovery · freshness",kind:"float",min:0,max:1,step:.05},{key:"WeightDiscNovelty",label:"Discovery · novelty",kind:"float",min:0,max:1,step:.05},{key:"WeightDiscSourceConfidence",label:"Discovery · source confidence",kind:"float",min:0,max:1,step:.05}]},{title:"Integrations",blurb:"Leave a URL empty to disable that integration entirely.",fields:[{key:"TmdbApiKey",label:"TMDB API key (v3)",kind:"secret",help:"The single most useful key here — artwork, trailers, discovery and watch providers all need it."},{key:"WatchProviderRegion",label:"Watch provider region",kind:"text",placeholder:"US",help:"ISO-3166-1 country code used to resolve streaming-provider branding."},{key:"JellyseerrUrl",label:"Jellyseerr URL",kind:"text",placeholder:"http://localhost:5055"},{key:"JellyseerrApiKey",label:"Jellyseerr API key",kind:"secret"},{key:"SonarrUrl",label:"Sonarr URL",kind:"text",placeholder:"http://localhost:8989"},{key:"SonarrApiKey",label:"Sonarr API key",kind:"secret"},{key:"RadarrUrl",label:"Radarr URL",kind:"text",placeholder:"http://localhost:7878"},{key:"RadarrApiKey",label:"Radarr API key",kind:"secret"}]},{title:"Trailers",blurb:"Where trailer URLs come from, and which videos are acceptable. Sources are tried in the order listed until one answers.",fields:[{key:"TrailerSourceOrder",label:"Source order",kind:"text",placeholder:"tmdb,jellyfin,stored",help:"Comma-separated. tmdb = TMDB videos (language-aware). jellyfin = trailer URLs Jellyfin already found for a library item — free, no key, but library items only. stored = the URL saved on the catalog row. search = ask yt-dlp to search YouTube by title and year; powerful, but it can return a fan edit or a review, so it is off by default. Remove a token to disable that source; unknown tokens are ignored."},{key:"TrailerLanguage",label:"Preferred language",kind:"text",placeholder:"en",help:"ISO 639-1. A matching-language trailer wins whenever one exists; otherwise the title's native trailer is used."},{key:"TrailerAllowTeasers",label:"Allow teasers",kind:"bool",help:"Use a teaser when no full trailer exists. Off means such titles simply get no trailer."},{key:"TrailerRequireOfficial",label:"Require official",kind:"bool",help:"Official videos are always preferred; this makes them mandatory, which reduces coverage."},{key:"TrailerAllowNonYouTube",label:"Allow non-YouTube",kind:"bool",help:"Accept Vimeo and similar. yt-dlp can fetch them, but they are rarer and less reliably the real trailer."},{key:"FeatureTrailerPrebuffer",label:"Prebuffer trailers",kind:"bool",help:"Download and transcode ahead of time. Needs yt-dlp and ffmpeg on the server."}]},{title:"Torrent streaming",blurb:"Off by default: peer traffic comes from this server's IP, so switching it on is an operator decision. The Torrent Streaming tab shows what these settings are actually doing.",fields:[{key:"FeatureSourceStreaming",label:"Source streaming",kind:"bool",help:"Master switch. Off means the endpoints 404 and the app hides the feature entirely."},{key:"ProwlarrUrl",label:"Prowlarr URL",kind:"text",placeholder:"http://localhost:9696",help:"Where sources are searched. Empty disables discovery. Only public indexers are ever used — private-tracker results are dropped, because streaming reads scattered pieces and stops when the viewer does, which gets accounts banned."},{key:"ProwlarrApiKey",label:"Prowlarr API key",kind:"secret"},{key:"SourceSearchCacheHours",label:"Search cache (hours)",kind:"int",min:1,max:168,help:"Shared across users. Empty results are cached for only 3 minutes regardless."},{key:"StreamCachePath",label:"Piece cache folder",kind:"text",placeholder:"empty uses orca-streams under the plugin data path",help:"Needs room for whole media files while streaming."},{key:"StreamCacheMaxGb",label:"Piece cache cap (GB)",kind:"int",min:1,max:2e3},{key:"StreamLibraryPath",label:"Keep folder",kind:"text",placeholder:"empty disables keeping",help:"Must be inside a Jellyfin library or the scan will never find what is copied there. Empty is the only safe default."},{key:"MaxConcurrentStreamSessions",label:"Concurrent sessions",kind:"int",min:1,max:20},{key:"StreamSessionIdleMinutes",label:"Idle timeout (minutes)",kind:"int",min:1,max:240,help:"How long a session with no reads survives."},{key:"StreamOpenTimeoutSeconds",label:"Open timeout (seconds)",kind:"int",min:0,max:600,help:"0 means none, which is the default: a popular torrent can take minutes to find its first peer, and a deadline used to report those as dead."}]},{title:"Peer discovery and privacy",blurb:"How the engine finds peers, and what it reveals doing so. Defaults match the behaviour that was hardcoded before these were editable.",fields:[{key:"StreamEnableDht",label:"Enable DHT",kind:"bool",help:"Finds peers without a tracker. Honest caveat: MonoTorrent's DHT has never bootstrapped on this server — the Torrent Streaming tab reports its real state rather than assuming this switch delivers."},{key:"StreamEnablePeerExchange",label:"Enable peer exchange (PeX)",kind:"bool",help:"Lets connected peers introduce the peers they know. Costs no extra connection attempts."},{key:"StreamEnableLocalPeerDiscovery",label:"Enable local peer discovery",kind:"bool",help:"Finds peers on your own network for free — but announces to the LAN what this server is downloading."},{key:"StreamEncryptionMode",label:"Encryption mode",kind:"select",options:[{value:"allow",label:"Allow encryption (prefer, accept plaintext)"},{value:"require",label:"Require encryption"},{value:"disable",label:"Disable encryption"}],help:"Require is more private and strictly shrinks the usable swarm, since unencrypted peers are refused."}]},{title:"Connectivity and port forwarding",blurb:"Inbound peers are the one source of extra swarm capacity that costs no outbound connection attempt. Making this server reachable is the most effective change available here — and the Torrent Streaming tab will tell you whether it worked.",fields:[{key:"StreamListenPort",label:"Inbound port",kind:"int",min:0,max:65535,help:"The local port peers connect in on. 0 picks a random one every restart, which means any router forward is stale immediately. Set a fixed high port (51413 is conventional) and forward it, and peers can reach you instead of only the other way round."},{key:"StreamAllowPortForwarding",label:"Ask the router (UPnP/NAT-PMP)",kind:"bool",help:"Fails soft: if the router refuses, the engine carries on outbound-only. A created mapping means the router agreed — not that a peer got through, which only the reachability check can show."}]},{title:"Advanced networking",blurb:"Leave both of these empty unless you know you need them. The inbound port above is the local endpoint peers connect to; thes  * The Observatory is a standalone page served by the plugin, so it owns the whole document.\r
 * Dark-first, matching Jellyfin's default, with a light mapping for admins who run it that way.\r
 */\r
\r
:root {\r
  --obs-bg: #101317;\r
  --obs-panel: #171b21;\r
  --obs-panel-2: #1d222a;\r
  --obs-line: #272d37;\r
  --obs-text: #e6e9ee;\r
  --obs-muted: #939ba8;\r
  --obs-accent: #4aa3df;\r
  --obs-ok: #3fb27f;\r
  --obs-warn: #d9a441;\r
  --obs-bad: #e0685f;\r
  --obs-off: #5a616d;\r
  --obs-radius: 10px;\r
  --obs-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;\r
}\r
\r
@media (prefers-color-scheme: light) {\r
  :root {\r
    --obs-bg: #f6f7f9;\r
    --obs-panel: #ffffff;\r
    --obs-panel-2: #f0f2f5;\r
    --obs-line: #dfe3e8;\r
    --obs-text: #1b1f26;\r
    --obs-muted: #626b78;\r
    --obs-off: #a4acb8;\r
  }\r
}\r
\r
* { box-sizing: border-box; }\r
\r
html, body {\r
  margin: 0;\r
  min-height: 100%;\r
  background: var(--obs-bg);\r
  color: var(--obs-text);\r
  color-scheme: dark light;\r
}\r
\r
.obs-root {\r
  background: var(--obs-bg);\r
  color: var(--obs-text);\r
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;\r
  font-size: 14px;\r
  line-height: 1.5;\r
  border-radius: var(--obs-radius);\r
  padding: 20px;\r
  min-height: 60vh;\r
}\r
\r
/* ---------- header + nav ---------- */\r
\r
.obs-head {\r
  display: flex;\r
  align-items: center;\r
  justify-content: space-between;\r
  gap: 16px;\r
  flex-wrap: wrap;\r
  margin-bottom: 18px;\r
}\r
\r
.obs-brand { display: flex; align-items: center; gap: 12px; }\r
\r
.obs-brand-mark {\r
  font-size: 30px;\r
  line-height: 1;\r
  color: var(--obs-accent);\r
}\r
\r
.obs-brand h1 {\r
  margin: 0;\r
  font-size: 21px;\r
  font-weight: 650;\r
  letter-spacing: -0.01em;\r
}\r
\r
.obs-brand p { margin: 0; }\r
\r
.obs-nav {\r
  display: flex;\r
  flex-wrap: wrap;\r
  gap: 4px;\r
  padding-bottom: 12px;\r
  margin-bottom: 20px;\r
  border-bottom: 1px solid var(--obs-line);\r
}\r
\r
.obs-navitem {\r
  appearance: none;\r
  border: 1px solid transparent;\r
  background: transparent;\r
  color: var(--obs-muted);\r
  font: inherit;\r
  padding: 7px 13px;\r
  border-radius: 999px;\r
  cursor: pointer;\r
  white-space: nowrap;\r
  transition: background 120ms ease, color 120ms ease;\r
}\r
\r
.obs-navitem:hover { background: var(--obs-panel-2); color: var(--obs-text); }\r
\r
.obs-navitem-active {\r
  background: var(--obs-accent);\r
  border-color: var(--obs-accent);\r
  color: #fff;\r
}\r
\r
.obs-navitem:focus-visible,\r
.obs-btn:focus-visible,\r
.obs-input:focus-visible,\r
.obs-select:focus-visible,\r
.obs-logline:focus-visible {\r
  outline: 2px solid var(--obs-accent);\r
  outline-offset: 2px;\r
}\r
\r
/* ---------- sections ---------- */\r
\r
.obs-section {\r
  background: var(--obs-panel);\r
  border: 1px solid var(--obs-line);\r
  border-radius: var(--obs-radius);\r
  padding: 16px 18px;\r
  margin-bottom: 16px;\r
}\r
\r
.obs-section-head {\r
  display: flex;\r
  align-items: flex-start;\r
  justify-content: space-between;\r
  gap: 16px;\r
  margin-bottom: 14px;\r
}\r
\r
.obs-section h2 { margin: 0; font-size: 15px; font-weight: 620; }\r
.obs-h3 { margin: 16px 0 8px; font-size: 13px; font-weight: 600; color: var(--obs-muted); }\r
.obs-section-head p { margin: 4px 0 0; max-width: 68ch; font-size: 12.5px; }\r
\r
/* ---------- tiles ---------- */\r
\r
.obs-tiles {\r
  display: grid;\r
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));\r
  gap: 10px;\r
}\r
\r
.obs-tile {\r
  background: var(--obs-panel-2);\r
  border: 1px solid var(--obs-line);\r
  border-radius: 8px;\r
  padding: 12px 14px;\r
}\r
\r
.obs-tile-label {\r
  font-size: 11px;\r
  text-transform: uppercase;\r
  letter-spacing: 0.06em;\r
  color: var(--obs-muted);\r
  margin-bottom: 6px;\r
}\r
\r
.obs-tile-value { font-size: 21px; font-weight: 600; font-variant-numeric: tabular-nums; }\r
.obs-tile-hint { font-size: 11.5px; color: var(--obs-muted); margin-top: 4px; }\r
\r
.obs-tile.obs-ok .obs-tile-value { color: var(--obs-ok); }\r
.obs-tile.obs-warn .obs-tile-value { color: var(--obs-warn); }\r
.obs-tile.obs-bad .obs-tile-value { color: var(--obs-bad); }\r
\r
/* ---------- sparklines ---------- */\r
\r
.obs-sparks {\r
  display: grid;\r
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));\r
  gap: 10px;\r
}\r
\r
.obs-sparkstat {\r
  background: var(--obs-panel-2);\r
  border: 1px solid var(--obs-line);\r
  border-radius: 8px;\r
  padding: 12px 14px;\r
}\r
\r
.obs-sparkstat-body {\r
  display: flex;\r
  align-items: flex-end;\r
  justify-content: space-between;\r
  gap: 12px;\r
}\r
\r
.obs-spark { color: var(--obs-accent); overflow: visible; }\r
\r
/* ---------- tables ---------- */\r
\r
.obs-tablewrap { overflow-x: auto; }\r
\r
.obs-table {\r
  width: 100%;\r
  border-collapse: collapse;\r
  font-variant-numeric: tabular-nums;\r
}\r
\r
.obs-table th {\r
  text-align: left;\r
  font-size: 11px;\r
  text-transform: uppercase;\r
  letter-spacing: 0.05em;\r
  color: var(--obs-muted);\r
  font-weight: 600;\r
  padding: 6px 10px;\r
  border-bottom: 1px solid var(--obs-line);\r
  white-space: nowrap;\r
}\r
\r
.obs-table td {\r
  padding: 7px 10px;\r
  border-bottom: 1px solid var(--obs-line);\r
}\r
\r
.obs-table tr:last-child td { border-bottom: none; }\r
.obs-clickable { cursor: pointer; }\r
.obs-clickable:hover td { background: var(--obs-panel-2); }\r
\r
/* ---------- meters + bars ---------- */\r
\r
.obs-meter { display: flex; align-items: center; gap: 10px; margin-top: 6px; }\r
\r
.obs-meter-track {\r
  flex: 1;\r
  height: 7px;\r
  background: var(--obs-panel-2);\r
  border-radius: 999px;\r
  overflow: hidden;\r
}\r
\r
/* No width transition: these redraw on a 5s poll, not on interaction, so animating them would\r
   force layout on every tick for motion nobody is watching. */\r
.obs-meter-fill { height: 100%; border-radius: 999px; }\r
\r
.obs-bars { display: grid; gap: 6px; margin-bottom: 14px; }\r
\r
.obs-bar-row {\r
  display: grid;\r
  grid-template-columns: minmax(90px, 160px) 1fr minmax(60px, auto);\r
  align-items: center;\r
  gap: 10px;\r
}\r
\r
.obs-bar-label {\r
  font-size: 12.5px;\r
  color: var(--obs-muted);\r
  overflow: hidden;\r
  text-overflow: ellipsis;\r
  white-space: nowrap;\r
}\r
\r
.obs-bar-track { height: 16px; background: var(--obs-panel-2); border-radius: 4px; overflow: hidden; }\r
\r
.obs-bar-fill {\r
  display: block;\r
  height: 100%;\r
  background: var(--obs-accent);\r
  border-radius: 4px;\r
}\r
\r
.obs-bar-value { font-size: 12.5px; font-variant-numeric: tabular-nums; text-align: right; }\r
\r
/* ---------- badges, chips, buttons ---------- */\r
\r
.obs-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }\r
\r
.obs-chip,\r
.obs-badge {\r
  display: inline-flex;\r
  align-items: center;\r
  gap: 6px;\r
  font-size: 12px;\r
  padding: 4px 10px;\r
  border-radius: 999px;\r
  background: var(--obs-panel-2);\r
  border: 1px solid var(--obs-line);\r
}\r
\r
.obs-badge::before {\r
  content: "";\r
  width: 7px;\r
  height: 7px;\r
  border-radius: 50%;\r
  background: currentColor;\r
}\r
\r
.obs-badge.obs-ok { color: var(--obs-ok); }\r
.obs-badge.obs-off { color: var(--obs-off); }\r
\r
.obs-actions { display: flex; gap: 8px; align-items: center; }\r
.obs-actions.obs-wrap { flex-wrap: wrap; }\r
\r
.obs-btn {\r
  appearance: none;\r
  font: inherit;\r
  font-size: 13px;\r
  padding: 7px 13px;\r
  border-radius: 7px;\r
  border: 1px solid var(--obs-line);\r
  background: var(--obs-panel-2);\r
  color: var(--obs-text);\r
  cursor: pointer;\r
  text-decoration: none;\r
  display: inline-block;\r
}\r
\r
.obs-btn:hover:not(:disabled) { border-color: var(--obs-accent); }\r
.obs-btn:disabled { opacity: 0.5; cursor: default; }\r
.obs-btn-primary { background: var(--obs-accent); border-color: var(--obs-accent); color: #fff; }\r
.obs-btn-danger { border-color: var(--obs-bad); color: var(--obs-bad); }\r
\r
/* ---------- log viewer ---------- */\r
\r
.obs-filters {\r
  display: flex;\r
  flex-wrap: wrap;\r
  align-items: center;\r
  gap: 10px;\r
  margin-bottom: 12px;\r
}\r
\r
.obs-check {\r
  display: inline-flex;\r
  align-items: center;\r
  gap: 5px;\r
  font-size: 12.5px;\r
  color: var(--obs-muted);\r
  cursor: pointer;\r
}\r
\r
.obs-input,\r
.obs-select {\r
  font: inherit;\r
  font-size: 13px;\r
  padding: 6px 10px;\r
  border-radius: 7px;\r
  border: 1px solid var(--obs-line);\r
  background: var(--obs-panel-2);\r
  color: var(--obs-text);\r
}\r
\r
.obs-input { flex: 1; min-width: 200px; }\r
\r
.obs-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }\r
.obs-ok-bg { background: var(--obs-ok); }\r
.obs-warn-bg { background: var(--obs-warn); }\r
.obs-bad-bg { background: var(--obs-bad); }\r
.obs-off-bg { background: var(--obs-off); }\r
\r
.obs-log {\r
  max-height: 62vh;\r
  overflow-y: auto;\r
  border: 1px solid var(--obs-line);\r
  border-radius: 8px;\r
  background: var(--obs-bg);\r
}\r
\r
.obs-logrow { border-bottom: 1px solid var(--obs-line); }\r
.obs-logrow:last-child { border-bottom: none; }\r
\r
.obs-logline {\r
  display: flex;\r
  align-items: baseline;\r
  gap: 10px;\r
  width: 100%;\r
  text-align: left;\r
  font: inherit;\r
  font-size: 12.5px;\r
  font-family: var(--obs-mono);\r
  background: none;\r
  border: none;\r
  color: inherit;\r
  padding: 6px 12px;\r
  cursor: pointer;\r
}\r
\r
.obs-logline:disabled { cursor: default; }\r
.obs-logline:hover:not(:disabled) { background: var(--obs-panel-2); }\r
\r
.obs-logtime { color: var(--obs-muted); white-space: nowrap; }\r
\r
.obs-loglevel {\r
  text-transform: uppercase;\r
  font-size: 10px;\r
  letter-spacing: 0.05em;\r
  width: 44px;\r
  flex-shrink: 0;\r
}\r
\r
.obs-logcomp { color: var(--obs-accent); white-space: nowrap; }\r
.obs-logevent { white-space: nowrap; }\r
.obs-logms { color: var(--obs-muted); white-space: nowrap; }\r
\r
.obs-logdata {\r
  color: var(--obs-muted);\r
  overflow: hidden;\r
  text-overflow: ellipsis;\r
  white-space: nowrap;\r
  flex: 1;\r
}\r
\r
.obs-logmore { color: var(--obs-muted); margin-left: auto; }\r
\r
.obs-level-error .obs-loglevel,\r
.obs-level-error .obs-logevent { color: var(--obs-bad); }\r
.obs-level-warn .obs-loglevel { color: var(--obs-warn); }\r
.obs-level-info .obs-loglevel { color: var(--obs-muted); }\r
\r
.obs-trace {\r
  margin: 0;\r
  padding: 10px 14px 14px 46px;\r
  font-family: var(--obs-mono);\r
  font-size: 11.5px;\r
  color: var(--obs-muted);\r
  white-space: pre-wrap;\r
  word-break: break-word;\r
  background: var(--obs-panel-2);\r
}\r
\r
/* ---------- timeline ---------- */\r
\r
.obs-timeline { display: grid; gap: 5px; }\r
\r
.obs-lane {\r
  display: grid;\r
  grid-template-columns: 130px 1fr;\r
  align-items: center;\r
  gap: 10px;\r
}\r
\r
.obs-lane-label {\r
  font-size: 12px;\r
  color: var(--obs-muted);\r
  font-family: var(--obs-mono);\r
  overflow: hidden;\r
  text-overflow: ellipsis;\r
}\r
\r
.obs-lane-track {\r
  position: relative;\r
  height: 20px;\r
  background: var(--obs-panel-2);\r
  border-radius: 4px;\r
  overflow: hidden;\r
}\r
\r
.obs-lane-mark {\r
  position: absolute;\r
  top: 3px;\r
  bottom: 3px;\r
  min-width: 2px;\r
  border-radius: 2px;\r
  background: var(--obs-accent);\r
}\r
\r
.obs-lane-mark.obs-level-error { background: var(--obs-bad); }\r
.obs-lane-mark.obs-level-warn { background: var(--obs-warn); }\r
\r
.obs-timeline-axis {\r
  display: flex;\r
  justify-content: space-between;\r
  margin-top: 8px;\r
  padding-left: 140px;\r
  font-size: 11.5px;\r
  color: var(--obs-muted);\r
  font-variant-numeric: tabular-nums;\r
}\r
\r
/* ---------- sign in ---------- */\r
\r
.obs-login {\r
  display: flex;\r
  align-items: center;\r
  justify-content: center;\r
  min-height: 100vh;\r
  padding: 24px;\r
  background: var(--obs-bg);\r
  color: var(--obs-text);\r
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;\r
  font-size: 14px;\r
}\r
\r
.obs-login-card {\r
  width: 100%;\r
  max-width: 380px;\r
  display: grid;\r
  gap: 16px;\r
  background: var(--obs-panel);\r
  border: 1px solid var(--obs-line);\r
  border-radius: var(--obs-radius);\r
  padding: 26px;\r
}\r
\r
.obs-login-card .obs-brand { margin-bottom: 4px; }\r
.obs-login-card h1 { margin: 0; font-size: 19px; font-weight: 650; }\r
.obs-login-card .obs-problem { margin: 0; }\r
\r
.obs-field { display: grid; gap: 6px; }\r
\r
.obs-field > span {\r
  font-size: 11px;\r
  text-transform: uppercase;\r
  letter-spacing: 0.06em;\r
  color: var(--obs-muted);\r
}\r
\r
.obs-field .obs-input { width: 100%; min-width: 0; padding: 9px 11px; }\r
.obs-btn-wide { width: 100%; text-align: center; padding: 10px; font-size: 14px; }\r
\r
/* ---------- misc ---------- */\r
\r
.obs-json {\r
  margin: 0;\r
  padding: 12px 14px;\r
  background: var(--obs-bg);\r
  border: 1px solid var(--obs-line);\r
  border-radius: 8px;\r
  font-family: var(--obs-mono);\r
  font-size: 12px;\r
  overflow-x: auto;\r
  max-height: 340px;\r
}\r
\r
/* ---------- settings form ---------- */\r
\r
.obs-savebar {\r
  position: sticky;\r
  top: 0;\r
  z-index: 5;\r
  display: flex;\r
  align-items: center;\r
  justify-content: space-between;\r
  gap: 16px;\r
  flex-wrap: wrap;\r
  background: var(--obs-panel);\r
  border: 1px solid var(--obs-line);\r
  border-radius: var(--obs-radius);\r
  padding: 12px 16px;\r
  margin-bottom: 16px;\r
}\r
\r
.obs-fields { display: grid; gap: 16px; }\r
\r
.obs-field-row {\r
  display: grid;\r
  grid-template-columns: minmax(180px, 260px) minmax(0, 1fr);\r
  align-items: center;\r
  gap: 8px 16px;\r
  padding-left: 10px;\r
  border-left: 2px solid transparent;\r
}\r
\r
.obs-field-changed { border-left-color: var(--obs-accent); }\r
.obs-field-label { font-size: 13px; }\r
\r
.obs-field-help {\r
  grid-column: 2;\r
  margin: 0;\r
  font-size: 12px;\r
  color: var(--obs-muted);\r
  max-width: 70ch;\r
}\r
\r
.obs-field-control { width: 100%; }\r
.obs-secret { display: flex; gap: 6px; align-items: center; }\r
.obs-secret .obs-input { flex: 1; min-width: 0; }\r
.obs-btn-small { padding: 5px 10px; font-size: 12px; }\r
\r
.obs-field-bool { grid-template-columns: 1fr; padding-left: 10px; }\r
.obs-field-bool .obs-field-help { grid-column: 1; padding-left: 26px; }\r
\r
.obs-switch {\r
  display: flex;\r
  align-items: center;\r
  gap: 10px;\r
  font-size: 13px;\r
  cursor: pointer;\r
}\r
\r
.obs-switch input { width: 16px; height: 16px; accent-color: var(--obs-accent); cursor: pointer; }\r
\r
@media (max-width: 720px) {\r
  .obs-field-row { grid-template-columns: 1fr; }\r
  .obs-field-help { grid-column: 1; }\r
}\r
\r
.obs-problems {\r
  margin: 0;\r
  padding-left: 18px;\r
  display: grid;\r
  gap: 4px;\r
  color: var(--obs-warn);\r
}\r
\r
.obs-stack { display: grid; gap: 14px; }\r
.obs-muted { color: var(--obs-muted); }\r
.obs-small { font-size: 12px; }\r
.obs-center { text-align: center; }\r
.obs-mono { font-family: var(--obs-mono); font-size: 12.5px; }\r
.obs-warn { color: var(--obs-warn); }\r
.obs-bad { color: var(--obs-bad); }\r
\r
.obs-empty,\r
.obs-note {\r
  color: var(--obs-muted);\r
  font-size: 13px;\r
  padding: 14px;\r
  text-align: center;\r
}\r
\r
.obs-note {\r
  text-align: left;\r
  background: var(--obs-panel-2);\r
  border-radius: 8px;\r
  color: var(--obs-text);\r
}\r
\r
.obs-problem {\r
  color: var(--obs-bad);\r
  background: color-mix(in srgb, var(--obs-bad) 12%, transparent);\r
  border: 1px solid var(--obs-bad);\r
  border-radius: 8px;\r
  padding: 10px 14px;\r
  font-size: 13px;\r
  margin: 0 0 16px;\r
}\r
\r
@media (max-width: 720px) {\r
  .obs-root { padding: 12px; }\r
  .obs-lane { grid-template-columns: 84px 1fr; }\r
  .obs-timeline-axis { padding-left: 94px; }\r
  .obs-bar-row { grid-template-columns: 84px 1fr auto; }\r
}\r
\r
@media (prefers-reduced-motion: reduce) {\r
  * { transition: none !important; }\r
}\r

</script>
</body>
</html>
